<!DOCTYPE html>
<html lang="en">
 
<head>
 
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 
  <title>North American Sports Map</title>
 
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
 
  <!-- Marker Clustering -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
 
  <!-- Your CSS -->
  <link rel="stylesheet" href="style.css" />
 
</head>
 
<body>
 
  <h2>North American Sports Map</h2>
 
  <p class="subtitle">LIVE TEAM RECORDS · MLB · NBA · NHL · NFL</p>
 
  <div id="status-bar">Initializing…</div>
 
  <div id="map"></div>
 
  <div class="legend">
 
    <div class="legend-item">
      <div class="legend-dot multi"></div>
      <span>4+ teams</span>
    </div>
 
    <div class="legend-item">
      <div class="legend-dot single"></div>
      <span>1–3 teams</span>
    </div>
 
    <div class="legend-item">
      <span class="season-tag live" style="font-size:0.65rem;">LIVE</span>
      <span>Current season</span>
    </div>
 
    <div class="legend-item">
      <span class="season-tag last" style="font-size:0.65rem;">'25–26</span>
      <span>Last season</span>
    </div>
 
  </div>
 
  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
 
  <!-- Marker Clustering -->
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
 
  <!-- Your JS -->
  <script src="script.js"></script>
 
</body>
</html>
